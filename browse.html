<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
  background: linear-gradient(to bottom right, #f3f5ff, #e1e5f2);
  font-family: Arial, sans-serif;
  padding: 20px;
}
.iframe-wrapper {
  background: #f0f0f0;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
  margin-bottom: 20px;
}

.iframe-wrapper iframe {
  width: 100%;
  height: 600px;
  border: none;
  border-radius: 8px;
}
.section-title {
  color: #fff;
  background: #5c4033;
  text-align: center;
  padding: 15px;
  font-size: 32px;
  font-weight: bold;
  border-radius: 10px;
  text-shadow: 0 0 5px #fff, 0 0 10px #ffb347;
}
.download-btn {
  padding: 10px 20px;
  background: #a0522d;
  color: #fff;
  border-radius: 5px;
  text-decoration: none;
}

.download-btn:hover {
  background: #8b4513;
}

</style>
</head>
<body>
    <h2 class="section-title">Explore Our Product Categories</h2>
    <div class="iframe-wrapper">
    <iframe src="rm-brochure.pdf.pdf"width="100%" height="800px" ></iframe>
    </div>
    <a href="yourfile.pdf" download class="download-btn">Download Brochure</a>
<script>
  document.getElementById("downloadLink").addEventListener("click", function () {
    alert("Downloading the brochure...");
    // The download happens automatically due to the 'download' attribute
  });
</script>
</body>
</html>
